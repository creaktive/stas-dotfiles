set -g mouse on

setw -g mode-keys vi
set -g set-titles on
set -g history-limit 100000
set -g escape-time 100

# tell apps when their pane gains/loses focus (Claude Code, Vim autoread/gitgutter)
set -g focus-events on

set -g prefix C-a
bind-key C-a last-window
bind-key / copy-mode \; send-keys /
bind-key ? copy-mode \; send-keys ?

# Vim-aware bindings: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

unbind %
bind c      new-window -c "#{pane_current_path}"
bind '"'    split-window -v -c "#{pane_current_path}"
# in Vim, C-a acts as C-w (see vimrc), so these split/switch Vim windows there;
# moves go through vim-tmux-navigator's C-h/j/k/l to leave Vim at its edge
bind |      if-shell "$is_vim" 'send-keys C-a |'  'split-window -h -c "#{pane_current_path}"'
bind -      if-shell "$is_vim" 'send-keys C-a -'  'split-window -v -c "#{pane_current_path}"'
bind \;     if-shell "$is_vim" { send-keys C-a \; } { last-pane }
bind h      if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind j      if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind k      if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind l      if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind Left   if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind Down   if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind Up     if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind Right  if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# C-h/j/k/l/\ move across Vim splits and tmux panes alike
bind -n C-h  if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n C-j  if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n C-k  if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
# no root C-l: keep it as clear-screen in shells (Vim's own C-l map still navigates)
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind -T copy-mode-vi C-h   select-pane -L
bind -T copy-mode-vi C-j   select-pane -D
bind -T copy-mode-vi C-k   select-pane -U
bind -T copy-mode-vi C-l   select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

# copy/paste stuff
bind ` copy-mode
bind \~ clear-history
unbind n
unbind p
bind p paste-buffer
bind -T copy-mode v send -X begin-selection
# bind -T copy-mode y send -X copy-selection

# Set status bar
set-option -g status on
set-option -g status-interval 10
set-option -g status-left-length 64
set-option -g status-right-length 128
# powerline glyphs (need a patched font): E0B0/E0B1 right bold/thin, E0B2/E0B3 left bold/thin
set-option -g status-left "#[fg=colour0,bg=colour33] #h #[fg=colour33,bg=colour235]\uE0B0"
set-option -g status-right "\
#[fg=colour89,bg=colour235]\uE0B2#[fg=colour211,bg=colour89] #{=/-40/...:#{s|^$HOME|~|:pane_current_path}} \
#[fg=colour0,bg=colour89]\uE0B2#[bg=colour0] #(rainbarf --tmux)#[bg=colour0] \
#[fg=colour136,bg=colour0]\uE0B3#[fg=colour136,bg=colour235] #(date -u +'%%H:%%M %%Z') "
set-window-option -g window-status-current-format "#[fg=colour235,bg=colour27,none]\uE0B0#[fg=colour255,bg=colour27] #I \uE0B1 #W #[fg=colour27,bg=colour235]\uE0B0"

# Automatically set window title
setw -g automatic-rename on

# Set window notifications
setw -g monitor-activity on
set -g visual-activity on

bind -n M-Left previous-window
bind -n M-Right next-window

# https://github.com/seebi/tmux-colors-solarized
#### COLOUR (Solarized dark)

# default statusbar colors
set-option -g status-style bg=black

# default window title colors
set-window-option -g window-status-style fg=brightblue

# pane border
set-option -g pane-border-style fg=black
set-option -g pane-active-border-style fg=brightgreen

# message text
set-option -g message-style bg=black,fg=brightred

# pane number display
set-option -g display-panes-active-colour blue
set-option -g display-panes-colour brightred

# clock
set-window-option -g clock-mode-colour green #green

set -as terminal-overrides ",*256col*:RGB:Ms=\033]52;%p1%s;%p2%s\007"
# clipboard via OSC 52: the terminal (kitty) sets its own clipboard; works over
# SSH and nested tmux, no pbcopy/xclip needed
set -s set-clipboard on
