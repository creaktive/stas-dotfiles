# Only non-default settings. Full reference: kitty +runpy 'from kitty.config import *; print(commented_out_default_config())'

# Fonts
font_family               Luculent
font_size                 11.0
text_composition_strategy legacy
modify_font               underline_thickness -1px

# Cursor
cursor_blink_interval 0

# Mouse and clipboard
url_color         #005cbb
url_style         straight
copy_on_select    clipboard
mouse_map         cmd+left release grabbed,ungrabbed mouse_handle_click link
# no-append: OSC 52 from tmux replaces the clipboard instead of appending to it
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask no-append

# Bell
enable_audio_bell no

# Windows and tabs
window_padding_width    0 1 0 1
hide_window_decorations yes
confirm_os_window_close 0
tab_bar_style           powerline
active_tab_font_style   bold

# Advanced
shell_integration disabled
term              xterm-256color

# Keyboard shortcuts

# Shift+Enter as Alt+Enter (ESC CR), a newline in Claude Code. kitty's own
# Shift+Enter encoding needs the kitty keyboard protocol, which tmux lacks;
# this is what Claude Code's /terminal-setup binds for other terminals
map shift+enter     send_text all \x1b\r
map kitty_mod+plus  no_op
map kitty_mod+minus no_op

# Solarized Dark by Ethan Schoonover (MIT)
background           #002b36
foreground           #839496
cursor               #708183
selection_background #073642
selection_foreground #93a1a1
color0               #002731
color8               #001e26
color1               #d01b24
color9               #bd3612
color2               #728905
color10              #465a61
color3               #a57705
color11              #52676f
color4               #2075c7
color12              #708183
color5               #c61b6e
color13              #5856b9
color6               #259185
color14              #81908f
color7               #e9e2cb
color15              #fcf4dc

# Tab bar colors
active_tab_foreground   #eeeeee
active_tab_background   #073642
inactive_tab_foreground #839496
inactive_tab_background #00222b

# Per-OS overrides: linux.conf or macos.conf
include ${KITTY_OS}.conf
